[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-builder"
version = "0.1.0"
description = "Unified ingestion pipeline for RAG-ready datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "requests>=2.32.0",
  "trafilatura>=2.0.0",
  "pypdf>=6.0.0",
  "youtube-transcript-api>=1.2.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "tqdm>=4.66.0",
  "orjson>=3.10.0",
  "pyyaml>=6.0.1",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "unstructured>=0.18.0"
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.0.0",
  "numpy>=1.26.0"
]

[project.scripts]
dataset-builder = "dataset_builder.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
